worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Docker embedded DNS; re-resolved every 10s so scaled app
    # containers are picked up without an nginx reload (#138).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream app_servers {
        server app:8000;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            # Variable forces per-request DNS resolution via the
            # resolver above instead of pinning the first container IP.
            set $app_upstream app:8000;
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /health {
            set $app_upstream app:8000;
            proxy_pass http://$app_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /ready {
            set $app_upstream app:8000;
            proxy_pass http://$app_upstream/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
