# Opt-in NEW local cluster only; requires Docker Compose >= 2.24.4 (!override).
# docker compose -p quadrourl-kraft -f docker-compose.yml -f docker-compose.kraft.yml up -d
services:
  zookeeper:
    profiles: [legacy-zookeeper]
  kafka:
    depends_on: !reset {}
    environment: !override
      # Keep the base image (cp-kafka:7.6.0); compare metadata modes, not versions.
      CLUSTER_ID: ${KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data
volumes:
  kafka-kraft-data:
