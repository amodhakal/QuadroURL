server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS; a variable proxy target re-resolves `app` per
    # request instead of once at startup, so this container no longer
    # crash-loops when it boots before the app replicas and keeps working
    # when app containers are replaced (mirrors nginx/nginx.conf).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Strip the /api/ prefix (the app serves / and /api/v1). The rewrite
        # is explicit because proxy_pass with variables skips nginx's
        # location-prefix substitution.
        rewrite ^/api/(.*)$ /$1 break;
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
